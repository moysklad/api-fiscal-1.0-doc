name: Build

on: push

jobs:
  date-check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2

      - name: Test dates in CHANGELOG.md
        run:
          cat CHANGELOG.md | egrep '^#+ +[0-9-]+' | sed -r 's/([0-9]+)-([0-9]+)-([0-9]+)/\3-\2-\1/g' | sort --check -nr;

  build:
    # ubuntu-latest — изменилась недавно на 26.04 с GCC 15. Старые нативные гемы (ffi 1.9.17 и др.)
    # на нём не собираются: поэтому версия указана явно как 24.04.
    runs-on: ubuntu-24.04
    needs: date-check
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.5.9'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Build
        run:
          bundle exec middleman build --build-dir=site

      - name: Deploy
        env:
          SERVER_IP_ADDRESS: ${{ secrets.SERVER_IP_ADDRESS }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          APP_PREFIX: api-fiscal
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          touch ~/.ssh/config && chmod 600 ~/.ssh/config
          echo -e "Host ${SERVER_IP_ADDRESS}\n\tStrictHostKeyChecking no\nPort ${SERVER_SSH_PORT}\n" >> ~/.ssh/config
          ssh-add - <<< "$DEPLOY_KEY"
          ssh app@${SERVER_IP_ADDRESS} pwd
          rsync -r --delete-after --quiet site/ app@${SERVER_IP_ADDRESS}:./${APP_PREFIX}
